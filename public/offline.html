<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#798A75" />
    <title>Doctiling Chat</title>
    <style>
      :root {
        --bg: #fbfaf9;
        --fg: #212e3b;
        --muted: #53606e;
        --primary: #798a75;
        --primary-fg: #f6f7f9;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #181f25;
          --fg: #e8e2d9;
          --muted: #b0a99b;
          --primary: #92a58d;
          --primary-fg: #181f25;
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      main {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 2rem 1.5rem calc(2rem + env(safe-area-inset-bottom));
        box-sizing: border-box;
      }
      h1 {
        font-family: Fraunces, Georgia, serif;
        font-weight: 600;
        font-size: 1.5rem;
        margin: 1rem 0 0.5rem;
      }
      p {
        color: var(--muted);
        max-width: 28rem;
        margin: 0.25rem 0;
      }
      button {
        margin-top: 1.5rem;
        min-height: 44px;
        padding: 0 1.5rem;
        border: 0;
        border-radius: 10px;
        background: var(--primary);
        color: var(--primary-fg);
        font: inherit;
        font-weight: 500;
      }
      .es {
        display: none;
      }
      html[lang='es'] .es {
        display: block;
      }
      html[lang='es'] .en {
        display: none;
      }
      svg {
        width: 48px;
        height: 48px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 20h.01" /><path d="M8.5 16.4a5 5 0 0 1 7 0" /><path d="M5 12.9a10 10 0 0 1 5.2-2.7" /><path d="M19 12.9a10 10 0 0 0-2.1-1.6" /><path d="M2 8.8A15 15 0 0 1 8.4 5.4" /><path d="M22 8.8a15 15 0 0 0-6.1-3.3" /><path d="m2 2 20 20" />
      </svg>
      <div class="en">
        <h1>No connection</h1>
        <p>Doctiling Chat needs a connection to your organisation.</p>
        <p>Nothing is stored on this device, so there is nothing to show while offline.</p>
        <button type="button" onclick="location.replace('/')">Retry</button>
      </div>
      <div class="es">
        <h1>Sin conexión</h1>
        <p>Doctiling Chat necesita conexión con tu organización.</p>
        <p>Nada se guarda en este dispositivo, así que no hay nada que mostrar sin red.</p>
        <button type="button" onclick="location.replace('/')">Reintentar</button>
      </div>
    </main>
    <script>
      try {
        var prefs = JSON.parse(localStorage.getItem('doctiling-chat:prefs') || '{}');
        var lang = prefs.language || ((navigator.language || '').toLowerCase().indexOf('es') === 0 ? 'es' : 'en');
        document.documentElement.lang = lang;
      } catch (e) {}
      addEventListener('online', function () {
        location.replace('/');
      });
    </script>
  </body>
</html>
