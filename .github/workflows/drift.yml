# The scheduled sweep: what degrades without any change breaking it (a STATUS.md verdict too old,
# a rule that never matched). It depends on the clock, so it is not a gate signal.
name: drift

on:
  schedule:
    - cron: "0 12 * * 1" # Mondays, 12:00 UTC
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: what degraded without any change breaking it
        run: node scripts/drift-check.mjs
