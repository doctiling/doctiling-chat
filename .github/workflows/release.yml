name: release

# Tag vX.Y.Z → the consumer (doctiling-web) pins the HTTPS tarball of that tag.
# There is no image and no registry any more: the release IS the tag, and this
# workflow only proves it is green and matches package.json `version`.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # @doctiling/ui is a peer that lives in the private doctiling-web repo
      # (packages/ui, raw TS). WEB_READ_TOKEN: a PAT with read access to it.
      - uses: actions/checkout@v4
        with:
          repository: doctiling/doctiling-web
          token: ${{ secrets.WEB_READ_TOKEN }}
          path: web
          sparse-checkout: packages/ui

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run gate
        env:
          DOCTILING_UI_DIR: ${{ github.workspace }}/web/packages/ui

      - name: Tag must match package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then echo "tag v$TAG ≠ package.json $PKG" >&2; exit 1; fi
