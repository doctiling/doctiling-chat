name: release

# Tag vX.Y.Z → ghcr.io/doctiling/chat:X.Y.Z and :latest. The tag must match
# package.json `version`; the gate runs first so a red tag never becomes an image.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run gate

      - name: Tag must match package.json version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then echo "tag v$TAG ≠ package.json $PKG" >&2; exit 1; fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/doctiling/chat:${{ steps.version.outputs.version }}
            ghcr.io/doctiling/chat:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      # A release that cannot be pulled is not a release.
      - name: Verify the image is published
        run: docker pull ghcr.io/doctiling/chat:${{ steps.version.outputs.version }}
